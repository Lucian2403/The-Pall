name: Verify Millhand workshop UI
on:
  pull_request:
    paths:
      - 'platform/apps/web/src/lib/**'
      - 'platform/scripts/verify-stage3-workbench-ui.mjs'
      - 'platform/scripts/verify-stage4-transport-ui.mjs'
      - 'platform/package.json'
      - '.github/workflows/verify-stage3-workbench.yml'
  push:
    branches:
      - 'ui/stage3-workbench-frames-20261101'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workshop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - run: npm ci
      - run: npm run build:packages
      - run: npm run verify:stage3-workbench-ui
      - run: npm run verify:stage4-transport-ui
      - run: node --test packages/game-core/test/millhand-second-job.test.mjs
      - run: npm run build -w @the-pall/web
