name: Verify Millhand workshop UI
on:
  pull_request:
    paths:
      - 'platform/apps/web/src/lib/**'
      - 'platform/apps/web/src/routes/**'
      - 'platform/apps/api/src/**'
      - 'platform/packages/game-core/src/**'
      - 'platform/packages/game-core/vendor/**'
      - 'platform/packages/game-core/test/**'
      - 'platform/scripts/verify-stage4-exits.mjs'
      - 'platform/scripts/verify-stage-five.mjs'
      - 'platform/scripts/verify-stage-six.mjs'
      - 'platform/scripts/verify-combat-cta-browser.mjs'
      - 'platform/scripts/verify-bellrunner-layout-browser.mjs'
      - 'platform/scripts/verify-millhand-scenes-browser.mjs'
      - 'platform/scripts/verify-bellrunner-stage3.test.ts'
      - 'platform/scripts/verify-bellrunner-stage4.test.ts'
      - 'platform/scripts/verify-bellrunner-stage5.test.ts'
      - 'platform/scripts/verify-bellrunner-stage6.test.ts'
      - 'platform/scripts/verify-bellrunner-stage5-browser.mjs'
      - 'platform/apps/web/static/locations/bellrunner/**'
      - 'platform/apps/web/static/characters/dogman/**'
      - 'platform/scripts/verify-dev-stage-rewind.mjs'
      - 'platform/scripts/verify-bellrunner-stage4-browser.mjs'
      - 'platform/scripts/verify-bellrunner-stage3-assets.mjs'
      - 'platform/scripts/verify-dialogue-speakers.test.ts'
      - 'platform/scripts/verify-dialogue-primary-style.mjs'
      - 'platform/scripts/verify-story-immersion.mjs'
      - 'platform/scripts/verify-approved-intro-copy.mjs'
      - 'platform/apps/web/static/locations/industrial/**'
      - 'platform/apps/web/static/audio/bellrunner/**'
      - 'platform/scripts/verify-stage-seven.test.ts'
      - 'platform/scripts/verify-stage-eight.test.ts'
      - 'platform/apps/web/static/locations/home/**'
      - 'platform/scripts/verify-character-welcome.mjs'
      - 'platform/scripts/characters-migrate.mjs'
      - 'platform/db/migrations/0008_millhand_clinic.sql'
      - 'platform/scripts/verify-stage6-postgres.integration.test.ts'
      - 'platform/db/migrations/**'
      - 'platform/apps/api/src/millhand-combat-opening.ts'
      - 'platform/db/migrations/0007_millhand_flint_combat.sql'
      - 'platform/scripts/verify-stage3-workbench-ui.mjs'
      - 'platform/scripts/verify-stage4-transport-ui.mjs'
      - 'platform/package.json'
      - '.github/workflows/verify-stage3-workbench.yml'
  push:
    branches:
      - 'ui/stage3-workbench-frames-20261101'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workshop:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pall_stage6_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pall_stage6_test"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 15
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - run: npm ci
      - run: npm run build:packages
      - run: npm run verify:stage3-workbench-ui
      - name: Bellrunner Stage 1 art, dialogue and handoff contract
        run: npm run verify:bellrunner-stage1
      - name: Bellrunner Stage 3 state machine, choices and authored dialogue beats
        run: npm run verify:bellrunner-stage3
      - name: Bellrunner Stage 4 all branch mechanics, inherited asset locations and dialogues
        run: npm run verify:bellrunner-stage4
      - name: Bellrunner Stage 5 Dogman dialogue, saved stances and supplied assets
        run: npm run verify:bellrunner-stage5
      - name: Bellrunner Stage 6 Dogman shared combat and tuned AI
        run: npm run verify:bellrunner-stage6
      - name: Every stage retains safe Back to previous Stage replay
        run: npm run verify:dev-rewind
      - name: Bellrunner Stage 3 owner art and sound
        run: npm run verify:bellrunner-stage3-assets
      - name: Canonical YOU speaker labels for all tutorial scenes
        run: npm run verify:dialogue-speakers
      - name: Millhand primary button art shared by both origins and every tutorial stage
        run: npm run verify:dialogue-primary-style
      - name: Immersive transitions — no out-of-world payout or debug recaps
        run: npm run verify:story-immersion
      - name: First-entry Welcome modal and character storage contract
        run: npm run verify:welcome
      - run: npm run verify:stage4-transport-ui
      - run: node --test packages/game-core/test/millhand-second-job.test.mjs packages/game-core/test/millhand-rewind.test.mjs packages/game-core/test/millhand-wage-claim.test.mjs
      - run: npm run verify:stage4-exits
      - run: npm run verify:stage-five
      - run: node --test packages/game-core/vendor/combat-v0.5.1/test.mjs packages/game-core/vendor/combat-v0.5.1/integration.test.mjs
      - run: npm run verify:stage-six
      - name: Stage 7 clinic state and canon
        run: npm run verify:stage-seven
      - name: Stage 8 home state, notice and persistence contract
        run: npm run verify:stage-eight
      - name: Inventory weights, stack merging and capacity unit tests
        run: npm run verify:inventory
      - name: PostgreSQL Stage 6–8 combat, clinic, final home and character lifecycle integration
        env:
          STAGE6_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/pall_stage6_test
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/pall_stage6_test
          BETTER_AUTH_SECRET: stage6-ci-only-not-for-production-4fbb68025eed91b3421c
        run: node --import tsx --test scripts/verify-stage6-postgres.integration.test.ts
      - run: npm run check:api
      - run: npm run build -w @the-pall/web
      - name: Real Chromium Stage 6 outcome CTA click and keyboard navigation
        timeout-minutes: 3
        run: timeout --signal=TERM --kill-after=5s 120s node scripts/verify-combat-cta-browser.mjs
      - name: Real Chromium Bellrunner Stage 4 all reused locations, action cards and journal
        timeout-minutes: 3
        run: timeout --signal=TERM --kill-after=5s 150s npm run verify:bellrunner-stage4-browser
      - name: Real Chromium Dogman scene, owner art and all three route callbacks
        timeout-minutes: 3
        run: timeout --signal=TERM --kill-after=5s 150s npm run verify:bellrunner-stage5-browser
      - name: Real Chromium Bellrunner Stage 1 and 2 workstation geometry
        timeout-minutes: 3
        run: timeout --signal=TERM --kill-after=5s 120s npm run verify:bellrunner-layout-browser
      - name: Real Chromium Millhand stages 1–8 and the matching primary button art
        timeout-minutes: 4
        run: timeout --signal=TERM --kill-after=5s 180s npm run verify:millhand-scenes-browser
      - name: Save Bellrunner 1272px and 1920px visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bellrunner-workstation-visual-qa
          path: |
            platform/test-artifacts/bellrunner-visuals/*.png
            platform/test-artifacts/bellrunner-stage4-visuals/*.png
            platform/test-artifacts/bellrunner-stage5-visuals/*.png
            platform/test-artifacts/millhand-scenes/*.png
          if-no-files-found: ignore
          retention-days: 7
